apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: hlidskjalf
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# Stable client entrypoint for producers/consumers that don't need per-pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: hlidskjalf
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
