apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topic
  namespace: hlidskjalf
  labels:
    app: kafka-create-topic
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kafka-create-topic
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          image: apache/kafka:3.9.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BROKER="kafka.hlidskjalf.svc.cluster.local:9092"
              echo "waiting for broker ${BROKER}..."
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" --list >/dev/null 2>&1; do
                echo "  not ready, retrying..."; sleep 3
              done
              echo "creating topic 'events' with ${PARTITIONS} partitions..."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" \
                --create --if-not-exists --topic events \
                --partitions "${PARTITIONS}" --replication-factor 2
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" \
                --describe --topic events
          env:
            # Change this to 4 vs 12 to demonstrate that partition count alone
            # does NOT move CPU when CONCURRENCY stays at 1.
            - name: PARTITIONS
              value: "12"
