apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: hlidskjalf
  labels:
    app: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: docker.io/yumikokawaii/consumer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 10080
          env:
            - name: KAFKA__BROKERS
              value: "kafka.hlidskjalf.svc.cluster.local:9092"
            - name: KAFKA__TOPIC
              value: "events"
            - name: KAFKA__CONSUMER_GROUP
              value: "consumer"
            # ---- the experiment knobs ----
            # Run 1: CONCURRENCY=1  -> ~1 core regardless of CHANNEL_BUFFER_SIZE
            # Run 2: CONCURRENCY=1, CHANNEL_BUFFER_SIZE=8192 -> identical (proves
            #        buffer/"stream capacity" is not the lever)
            # Run 3: CONCURRENCY=12 -> CPU climbs toward the 2-core limit
            - name: KAFKA__CONCURRENCY
              value: "1"
            - name: KAFKA__CHANNEL_BUFFER_SIZE
              value: "256"
            - name: KAFKA__WORK_ITERATIONS
              value: "50000"
            - name: KAFKA__ACK_AFTER_WORK
              value: "true"
            - name: KAFKA__WORK_DELAY_MS
              value: "0"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: hlidskjalf
  labels:
    app: consumer
spec:
  selector:
    app: consumer
  ports:
    - name: http
      port: 10080
      targetPort: 10080
