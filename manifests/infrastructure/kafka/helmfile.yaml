repositories:
  # Bitnami chart served from the OCI registry (artifacthub.io/packages/helm/bitnami/kafka).
  - name: bitnamicharts
    url: registry-1.docker.io/bitnamicharts
    oci: true

releases:
  - name: kafka
    namespace: hlidskjalf
    createNamespace: true
    chart: bitnamicharts/kafka
    # Kafka 3.9 (not 4.0): Shopify sarama 1.38 caps at protocol 3.3 and cannot
    # negotiate Kafka 4.0's group-coordinator APIs. 3.9 still serves them.
    version: 31.5.0
    wait: true
    timeout: 600
    values:
      - values.yaml
