apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observe
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "hlidskjalf-services"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - hlidskjalf
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: (echo|acoustics|bifrost|consumer)
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # cAdvisor (via kubelet) exposes container_cpu_usage_seconds_total — the
      # metric we graph to prove CPU scales with consumer CONCURRENCY.
      - job_name: "kubernetes-cadvisor"
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        metric_relabel_configs:
          # Keep only the pods we care about to limit cardinality.
          - source_labels: [namespace]
            regex: hlidskjalf
            action: keep

#      - job_name: "otel-collector"
#        static_configs:
#          - targets: ["otel-collector.observe.svc.cluster.local:8889"]
