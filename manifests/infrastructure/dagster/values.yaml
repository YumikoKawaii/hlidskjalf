# Dagster with K8sRunLauncher + celery_executor, mirroring integration-ingress.
# Flow: webserver/daemon -> one K8s Job pod PER RUN (per partition); that run's
#       steps are dispatched as Celery tasks over Redis to the celery worker
#       Deployment (manifests/infrastructure/dagster/celery-worker.yaml).
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      # Run pods need the broker/backend env so celery_executor can submit steps.
      envVars:
        - DAGSTER_CELERY_BROKER_URL=redis://redis:6379/0
        - DAGSTER_CELERY_BACKEND_URL=redis://redis:6379/1

# Use an existing external PostgreSQL instead of the chart's bundled one
# (the bundled Postgres needs a PVC the review cluster can't attach).
# Connection creds (host/user/password/db) live in the gitignored
# values.secret.yaml, layered after this file in the helmfile.
postgresql:
  enabled: false
  service:
    port: 5432

# Our pipeline code, built+pushed by .github/workflows/dagster-lab.yaml.
dagster-user-deployments:
  enabled: true
  deployments:
    - name: dagster-lab
      image:
        repository: docker.io/yumikokawaii/dagster-lab
        tag: efdeb8b
        pullPolicy: Always
      dagsterApiGrpcArgs:
        - "-f"
        - "repo.py"
      port: 3030
      # Code-location process needs the broker env too (executor config reads it).
      env:
        - name: DAGSTER_CELERY_BROKER_URL
          value: redis://redis:6379/0
        - name: DAGSTER_CELERY_BACKEND_URL
          value: redis://redis:6379/1
