apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bifrost
  namespace: hlidskjalf
  labels:
    app: bifrost
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - services
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bifrost
  namespace: hlidskjalf
  labels:
    app: bifrost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bifrost
subjects:
  - kind: ServiceAccount
    name: bifrost
    namespace: hlidskjalf
