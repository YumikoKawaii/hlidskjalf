image:
  repository: docker.io/yumikokawaii/trigger
  tag: "eb068f6"

host: trigger.example.com

service:
  type: "ClusterIP"

reloader: true

replicas: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

sidecar:
  enabled: true
  image:
    repository: docker.io/yumikokawaii/skidbladnir
    tag: "a742d69"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  ACOUSTICS__ENDPOINT: "http://bifrost:10080"
  ACOUSTICS__PROTOCOL: "http"
  ECHO__ENDPOINT: "http://bifrost:10080"
  ECHO__PROTOCOL: "http"
  CHAOS__INTERVAL: "100000" # 0.1ms
  SKIDBLADNIR_SERVER__HTTP: "0.0.0.0:15001"