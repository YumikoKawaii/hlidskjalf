image:
  repository: docker.io/yumikokawaii/trigger
  tag: "07f297a"

host: trigger.example.com

service:
  type: "ClusterIP"

reloader: true

networkPolicy:
  enabled: true
  allowedSources: []

replicas: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

sidecar:
  enabled: true
  image:
    repository: docker.io/yumikokawaii/skidbladnir
    tag: "ba3b72c"
  ports:
    outbound: 15001
    inboundGrpc: 15002
    inboundHttp: 15003
    appGrpc: 10443
    appHttp: 10080
    leaderGrpc: 15443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  ACOUSTICS__ENDPOINT: "acoustics:10443"
  ACOUSTICS__PROTOCOL: "grpc"
  ECHO__ENDPOINT: "echo:10443"
  ECHO__PROTOCOL: "grpc"
  CHAOS__RPS: "100" # 100 rps/instance × 10 instances = ~1000 rps
  SKIDBLADNIR_SERVER__HTTP: "0.0.0.0:15001"
  SKIDBLADNIR_SERVER__GRPC: "0.0.0.0:15443"
  OUTBOUND__PORT: "15001"
  INBOUND__GRPC__ENDPOINT: "0.0.0.0:15002"
  INBOUND__GRPC__TARGET_PORT: "10443"
  INBOUND__HTTP__ENDPOINT: "0.0.0.0:15003"
  INBOUND__HTTP__TARGET_PORT: "10080"
  SERVICE: "trigger"
  NAMESPACE: "hlidskjalf"