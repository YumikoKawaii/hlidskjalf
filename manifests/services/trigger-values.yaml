image:
  repository: docker.io/yumikokawaii/trigger
  tag: "d5e9237"

host: trigger.example.com

service:
  type: "ClusterIP"

reloader: true

networkPolicy:
  enabled: true
  allowedSources: []

replicas: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

sidecar:
  enabled: false
  image:
    repository: docker.io/yumikokawaii/skidbladnir
    tag: "d5e9237"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  ACOUSTICS__ENDPOINT: "http://bifrost:10080"
  ACOUSTICS__PROTOCOL: "http"
  ECHO__ENDPOINT: "http://bifrost:10080"
  ECHO__PROTOCOL: "http"
  CHAOS__RPS: "170" # 100 rps/instance × 10 instances = ~1000 rps
  SKIDBLADNIR_SERVER__HTTP: "0.0.0.0:15001"