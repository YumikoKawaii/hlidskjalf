image:
  repository: docker.io/yumikokawaii/trigger
  tag: "eb068f6"

host: trigger.example.com

reloader: true

replicas: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  ACOUSTICS__ENDPOINT: "acoustics:10443"
  ACOUSTICS__PROTOCOL: "grpc"
  ECHO__ENDPOINT: "echo:10443"
  ECHO__PROTOCOL: "grpc"
  CHAOS__INTERVAL: "100000" # 0.1ms