{{- if and .Values.networkPolicy (ne .Values.networkPolicy.enabled false) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.allowedSources }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ .app }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observe
      ports:
        - protocol: TCP
          port: 10080
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10080
    {{- if and $.Values.sidecar $.Values.sidecar.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ $.Release.Name }}
      ports:
        - protocol: TCP
          port: {{ $.Values.sidecar.ports.outbound }}
        - protocol: TCP
          port: {{ $.Values.sidecar.ports.leaderGrpc | default 15443 }}
    {{- end }}
{{- end }}
