apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- $serviceType := dig "service" "type" "ClusterIP" .Values }}
  type: {{ $serviceType }}
  {{- if eq $serviceType "None" }}
  clusterIP: None
  {{- end }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: grpc
      port: 10443
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 10080
      targetPort: http
      protocol: TCP
