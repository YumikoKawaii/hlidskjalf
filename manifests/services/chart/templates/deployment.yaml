apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ if kindIs "invalid" .Values.replicas }}1{{ else }}{{ .Values.replicas }}{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      {{- if .Values.reloader }}
      annotations:
        reloader.stakater.com/auto: "true"
      {{- end }}
    spec:
      {{- if and .Values.serviceAccount .Values.serviceAccount.create }}
      serviceAccountName: {{ .Release.Name }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      {{- if and .Values.sidecar .Values.sidecar.enabled }}
      initContainers:
        - name: skidbladnir-init
          image: {{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
          command:
            - sh
            - -c
            - |
              iptables -t nat -N SKIDBLADNIR_REDIRECT
              iptables -t nat -A SKIDBLADNIR_REDIRECT -m owner --uid-owner 1337 -j RETURN
              iptables -t nat -A SKIDBLADNIR_REDIRECT -d 127.0.0.1/32 -j RETURN
              iptables -t nat -A SKIDBLADNIR_REDIRECT -p tcp -j REDIRECT --to-ports 15001
              iptables -t nat -A OUTPUT -p tcp -j SKIDBLADNIR_REDIRECT
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - name: grpc
              containerPort: 10443
              protocol: TCP
            - name: http
              containerPort: 10080
              protocol: TCP
          {{- $probePort := "http" }}
          {{- if and .Values.probes .Values.probes.port }}
          {{- $probePort = .Values.probes.port }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: {{ $probePort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: {{ $probePort }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: {{ $probePort }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
        {{- if and .Values.sidecar .Values.sidecar.enabled }}
        - name: skidbladnir
          image: {{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1337
          ports:
            - name: sidecar
              containerPort: 15001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: sidecar
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: sidecar
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: sidecar
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
        {{- end }}
