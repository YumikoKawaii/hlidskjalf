apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: load
  name: load
  namespace: autoscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load
  strategy: {}
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
      - image: busybox:latest
        name: busybox
        command:
          - sh
          - -c
          - while true; do wget -qO- http://web.autoscale >/dev/null; done
        resources: {}
